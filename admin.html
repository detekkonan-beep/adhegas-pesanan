
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin AdheGas</title>

<style>
*{box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#eef2f7;
padding:12px;
margin:0;
}

.container{
background:white;
padding:18px;
border-radius:12px;
max-width:1000px;
margin:15px auto;
}

h2{color:#1769aa}

input{
width:100%;
padding:13px;
margin:8px 0 15px;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
}

button{
padding:12px 16px;
background:#1769aa;
color:white;
border:0;
border-radius:7px;
font-size:15px;
margin:4px;
cursor:pointer;
}

.edit{background:#16834a}
.hapus{background:#d93025}
.batal{background:#777}

#dashboard{display:none}

#hasil{
padding:10px;
color:#1769aa;
font-weight:bold;
}

#formEdit{
display:none;
background:#eaf3fc;
padding:15px;
border-radius:10px;
margin:15px 0;
border:1px solid #b9d5ed;
}

.table-wrap{
width:100%;
overflow-x:auto;
}

table{
width:100%;
min-width:650px;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:12px;
border:1px solid #ccc;
text-align:left;
}

/* BARIS SELANG-SELING */

#daftar tr:nth-child(odd) td{
background:#111;
color:white;
}

#daftar tr:nth-child(even) td{
background:white;
color:black;
}

/* TOMBOL DALAM DAFTAR */

#daftar button{
font-size:13px;
padding:9px 12px;
}

#daftar .edit{background:#16834a;color:white}
#daftar .hapus{background:#d93025;color:white}

th{
background:#1769aa;
color:white;
}

@media(max-width:600px){
.container{padding:12px}
h2{font-size:21px}
button{font-size:14px}
}
</style>
</head>

<body>

<div class="container">

<h2>ADMINISTRATOR ADHEGAS</h2>

<!-- LOGIN -->

<div id="login">

<h3>Login Administrator</h3>

<label>Email</label>
<input id="email" type="email" placeholder="Email Anda">

<label>Password</label>
<input id="password" type="password" placeholder="Password Anda">

<button onclick="login()">LOGIN</button>

</div>

<p id="hasil"></p>

<!-- DASHBOARD -->

<div id="dashboard">

<h3>DAFTAR PESANAN</h3>

<button onclick="muatPesanan()">MUAT ULANG</button>
<button onclick="logout()">LOGOUT</button>

<!-- FORM EDIT -->

<div id="formEdit">

<h3>EDIT PESANAN</h3>

<input type="hidden" id="editId">

<label>Alamat</label>
<input id="editAlamat" type="text">

<label>Barang</label>
<input id="editBarang" type="text">

<label>Jumlah</label>
<input id="editJlh" type="number" min="1">

<label>Customer</label>
<input id="editCustomer" type="text">

<button onclick="simpanEdit()">SIMPAN PERUBAHAN</button>

<button class="batal" onclick="batalEdit()">BATAL</button>

</div>

<!-- TABEL PESANAN -->

<div class="table-wrap">

<table>

<thead>
<tr>
<th>ID</th>
<th>Alamat</th>
<th>Barang</th>
<th>Jumlah</th>
<th>Customer</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="daftar"></tbody>

</table>

</div>

</div>
</div>

<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
'https://bbjhnulqwhugdxucwjip.supabase.co',
'sb_publishable_VMUc-hCmm1YznMRzQE5wxg_YmUXz2Uh'
);

const hasil=document.getElementById('hasil');

function pesan(teks){
hasil.textContent=teks;
}

// CEK ADMIN

async function periksaAdmin(){

const {data:{user}}=await supabase.auth.getUser();

if(!user)return false;

const {data,error}=await supabase
.from('admin_users')
.select('user_id')
.eq('user_id',user.id)
.maybeSingle();

if(error){
pesan('Gagal memeriksa admin: '+error.message);
return false;
}

return !!data;
}

// TAMPILKAN DASHBOARD

async function tampilkanDashboard(){

const admin=await periksaAdmin();

if(!admin){
pesan('Akun ini bukan administrator.');
await supabase.auth.signOut();
return;
}

document.getElementById('login').style.display='none';
document.getElementById('dashboard').style.display='block';

pesan('Login berhasil.');

await muatPesanan();

}

// LOGIN

window.login=async function(){

const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;

if(!email||!password){
pesan('Isi email dan password.');
return;
}

pesan('Sedang login...');

const {error}=await supabase.auth.signInWithPassword({
email,password
});

if(error){
pesan('Login gagal: '+error.message);
return;
}

await tampilkanDashboard();

};

// LOGOUT

window.logout=async function(){

await supabase.auth.signOut();

document.getElementById('login').style.display='block';
document.getElementById('dashboard').style.display='none';

batalEdit();

pesan('Anda sudah logout.');

};

// PENGAMAN TEKS

function aman(value){

return String(value??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));

}

// MUAT PESANAN

window.muatPesanan=async function(){

pesan('Mengambil data pesanan...');

const {data,error}=await supabase
.from('Pesan')
.select('*')
.order('id',{ascending:false});

if(error){
pesan('Gagal mengambil data: '+error.message);
return;
}

const daftar=document.getElementById('daftar');

daftar.innerHTML='';

data.forEach((p,index)=>{
const tr=document.createElement('tr');
const warna=index % 2 === 0;
tr.style.backgroundColor=warna ? '#000000' : '#ffffff';
tr.style.color=warna ? '#ffffff' : '#000000';
tr.innerHTML=`
<td>${aman(p.id)}</td>
<td>${aman(p.alamat)}</td>
<td>${aman(p.barang)}</td>
<td>${aman(p.jlh)}</td>
<td>${aman(p.customer)}</td>
<td>
<button class="edit">EDIT</button>
<button class="hapus">HAPUS</button>
</td>
`;
tr.querySelectorAll('td').forEach(td=>{
td.style.backgroundColor=warna ? '#000000' : '#ffffff';
td.style.color=warna ? '#ffffff' : '#000000';
});
tr.querySelector('.edit').onclick=()=>{
editPesanan(p);
};
tr.querySelector('.hapus').onclick=()=>{
hapusPesanan(p.id);
};
daftar.appendChild(tr);
});


pesan('Jumlah pesanan: '+data.length);

};

// EDIT PESANAN

function editPesanan(p){

document.getElementById('formEdit').style.display='block';

document.getElementById('editId').value=p.id;
document.getElementById('editAlamat').value=p.alamat??'';
document.getElementById('editBarang').value=p.barang??'';
document.getElementById('editJlh').value=p.jlh??'';
document.getElementById('editCustomer').value=p.customer??'';

pesan('Silakan ubah pesanan.');

document.getElementById('formEdit').scrollIntoView({
behavior:'smooth'
});

}

// SIMPAN EDIT

window.simpanEdit=async function(){

const id=document.getElementById('editId').value;

const alamat=document.getElementById('editAlamat').value.trim();
const barang=document.getElementById('editBarang').value.trim();
const jlh=document.getElementById('editJlh').value;
const customer=document.getElementById('editCustomer').value.trim();

if(!alamat||!barang||!jlh||!customer){
pesan('Semua kolom harus diisi.');
return;
}

if(!Number.isInteger(Number(jlh))||Number(jlh)<1){
pesan('Jumlah minimal 1.');
return;
}

pesan('Menyimpan perubahan...');

const {data,error}=await supabase
.from('Pesan')
.update({
alamat:alamat,
barang:barang,
jlh:Number(jlh),
customer:customer
})
.eq('id',id)
.select();

if(error){
pesan('Gagal menyimpan: '+error.message);
return;
}

if(!data||data.length===0){
pesan('Data tidak berubah. Periksa izin UPDATE Supabase.');
return;
}

document.getElementById('formEdit').style.display='none';

pesan('Pesanan berhasil diperbarui.');

await muatPesanan();

};

// BATAL EDIT

window.batalEdit=function(){

document.getElementById('formEdit').style.display='none';

document.getElementById('editId').value='';
document.getElementById('editAlamat').value='';
document.getElementById('editBarang').value='';
document.getElementById('editJlh').value='';
document.getElementById('editCustomer').value='';

};

// HAPUS PESANAN

async function hapusPesanan(id){

if(!confirm('Yakin ingin menghapus pesanan ini?'))return;

const {error}=await supabase
.from('Pesan')
.delete()
.eq('id',id);

if(error){
pesan('Gagal menghapus: '+error.message);
return;
}

pesan('Pesanan berhasil dihapus.');

await muatPesanan();

}

// PERIKSA SESSION

const {data:{session}}=await supabase.auth.getSession();

if(session){
await tampilkanDashboard();
}

</script>

</body>
</html>
