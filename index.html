
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Pesanan AdheGas</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {box-sizing:border-box}
body {
  font-family:Arial,sans-serif;
  background:#eef2f7;
  padding:15px;
  margin:0;
}
.container {
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}
h2 {color:#1769aa}
label {
  display:block;
  margin-top:10px;
}
input,select {
  width:100%;
  padding:14px;
  margin:8px 0 15px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button {
  width:100%;
  padding:15px;
  background:#1769aa;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
  margin-top:8px;
}
button:disabled {
  background:#999;
}
#hasil {
  margin-top:15px;
  font-weight:bold;
}
#petaModal {
  display:none;
  position:fixed;
  inset:0;
  background:white;
  z-index:9999;
  padding:12px;
  overflow:auto;
}
#map {
  height:60vh;
  width:100%;
  border-radius:10px;
  margin-top:10px;
}
.tutup {background:#666}
</style>
</head>

<body>

<div class="container">

<h2>Input Pesanan AdheGas</h2>

<form id="formPesan">

<label>Alamat Pengiriman</label>
<input id="alamat"
placeholder="Tekan untuk memilih lokasi"
readonly required>

<label>Barang</label>
<select id="barang" required>
<option value="">Memuat barang...</option>
</select>

<label>Jumlah (jlh)</label>
<input id="jlh" type="number" min="1" required>

<label>Customer</label>
<input id="customer" required>

<button type="submit" id="tombolSimpan">
Simpan Pesanan
</button>

</form>

<p id="hasil"></p>

</div>

<div id="petaModal">

<h3>Tentukan Lokasi Pengiriman</h3>

<p id="statusGPS">
Sedang mempersiapkan peta...
</p>

<div id="map"></div>

<button type="button" id="pilihLokasi">
Gunakan Lokasi Ini
</button>

<button type="button" class="tutup" id="batalPeta">
Batal
</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import {createClient} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
'https://bbjhnulqwhugdxucwjip.supabase.co',
'sb_publishable_VMUc-hCmm1YznMRzQE5wxg_YmUXz2Uh'
);

const el = id => document.getElementById(id);

let map = null;
let marker = null;
let latitude = null;
let longitude = null;
let alamatTerpilih = '';
let lokasiSiap = false;
let alamatSedangDicari = false;
let permintaanAlamat = 0;


// MEMUAT BARANG DARI SUPABASE

async function muatBarang() {

  const pilihan = el('barang');
  const hasil = el('hasil');

  pilihan.innerHTML =
    '<option value="">Menghubungkan ke database...</option>';

  try {

    const {data,error,status} = await supabase
      .from('stok_barang')
      .select('id,nama_barang')
      .order('nama_barang')
      .limit(100);

    console.log('Status:',status);
    console.log('Data barang:',data);
    console.log('Error:',error);

    if(error) {
      pilihan.innerHTML =
        '<option value="">Gagal membaca barang</option>';

      hasil.textContent =
        'ERROR DATABASE: '+error.message;
      return;
    }

    if(!data || data.length === 0) {
      pilihan.innerHTML =
        '<option value="">Data kosong</option>';

      hasil.textContent =
        'API berhasil dihubungi tetapi tidak menemukan barang.';

      return;
    }

    pilihan.innerHTML =
      '<option value="">Pilih Barang</option>';

    data.forEach(item => {

      const option = document.createElement('option');

      option.value = item.nama_barang;
      option.textContent = item.nama_barang;

      pilihan.appendChild(option);

    });

    hasil.textContent =
      'Berhasil memuat '+data.length+' jenis barang.';

  } catch(error) {

    pilihan.innerHTML =
      '<option value="">Koneksi gagal</option>';

    hasil.textContent =
      'KESALAHAN: '+error.message;

  }
}

muatBarang();


// MEMBUKA PETA

el('alamat').addEventListener('click',bukaPeta);

function bukaPeta() {

  el('petaModal').style.display = 'block';

  if(!map) {

    map = L.map('map').setView([-2.5,118],5);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution:'© OpenStreetMap'
      }
    ).addTo(map);

    marker = L.marker([-2.5,118],{
      draggable:true
    }).addTo(map);

    marker.on('dragend',()=>{
      ambilKoordinat();
    });

    map.on('click',e=>{
      marker.setLatLng(e.latlng);
      ambilKoordinat();
    });

    setTimeout(()=>{
      map.invalidateSize();
    },300);
  }

  lokasiSiap = false;
  alamatTerpilih = '';

  el('statusGPS').textContent =
    'Sedang mencari posisi GPS...';

  if(!navigator.geolocation) {
    el('statusGPS').textContent =
      'GPS tidak didukung. Silakan pilih lokasi pada peta.';
    return;
  }

  navigator.geolocation.getCurrentPosition(

    pos => {

      latitude = pos.coords.latitude;
      longitude = pos.coords.longitude;

      marker.setLatLng([latitude,longitude]);
      map.setView([latitude,longitude],17);

      ambilKoordinat();

    },

    error => {

      el('statusGPS').textContent =
        'GPS tidak berhasil. Anda dapat memilih lokasi secara manual pada peta.';

      map.setView([-2.5,118],5);

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );
}

// MENGAMBIL KOORDINAT PIN

async function ambilKoordinat() {

  const pos = marker.getLatLng();

  latitude = pos.lat;
  longitude = pos.lng;

  lokasiSiap = false;
  alamatTerpilih = '';

  const nomor = ++permintaanAlamat;

  el('statusGPS').textContent =
    'Mengambil alamat lokasi...';

  alamatSedangDicari = true;

  try {

    const url =
      'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='
      +latitude+'&lon='+longitude;

    const response = await fetch(url);

    if(!response.ok) {
      throw new Error('Alamat tidak ditemukan');
    }

    const data = await response.json();

    if(nomor !== permintaanAlamat) return;

    if(!data.display_name) {
      throw new Error('Alamat tidak tersedia');
    }

    alamatTerpilih = data.display_name;
    lokasiSiap = true;

    el('statusGPS').textContent =
      'Alamat ditemukan. Tekan Gunakan Lokasi Ini.';

  } catch(error) {

    if(nomor === permintaanAlamat) {
      lokasiSiap = false;
      alamatTerpilih = '';

      el('statusGPS').textContent =
        'Alamat gagal ditemukan. Coba geser pin atau pilih titik lain.';
    }

  } finally {

    if(nomor === permintaanAlamat) {
      alamatSedangDicari = false;
    }

  }
}

// GUNAKAN LOKASI

el('pilihLokasi').addEventListener('click',()=>{

  if(alamatSedangDicari) {
    alert('Mohon tunggu, alamat sedang dicari.');
    return;
  }

  if(!lokasiSiap || !alamatTerpilih) {
    alert('Pilih lokasi yang alamatnya berhasil ditemukan.');
    return;
  }

  el('alamat').value = alamatTerpilih;

  el('petaModal').style.display = 'none';

});

// BATAL

el('batalPeta').addEventListener('click',()=>{

  el('petaModal').style.display = 'none';

});

// SIMPAN PESANAN

el('formPesan').addEventListener('submit',async e=>{

  e.preventDefault();

  if(!lokasiSiap || !alamatTerpilih ||
     el('alamat').value !== alamatTerpilih) {

    alert('Silakan tentukan alamat melalui peta terlebih dahulu.');
    return;
  }

  const data = {

    alamat:alamatTerpilih,
    barang:el('barang').value,
    jlh:Number(el('jlh').value),
    customer:el('customer').value.trim(),
    latitude:latitude,
    longitude:longitude

  };

  const hasil = el('hasil');
  const tombol = el('tombolSimpan');

  tombol.disabled = true;
  hasil.textContent = 'Sedang menyimpan pesanan...';

  try {

    const {error} = await supabase
      .from('Pesan')
      .insert(data);

    if(error) {
      hasil.textContent =
        'GAGAL: '+error.message;
    } else {

      hasil.textContent =
        'PESANAN BERHASIL DISIMPAN';

      el('formPesan').reset();

      latitude = null;
      longitude = null;
      alamatTerpilih = '';
      lokasiSiap = false;

    }

  } catch(error) {

    hasil.textContent =
      'GAGAL: '+error.message;

  } finally {

    tombol.disabled = false;

  }

});

</script>
</body>
</html>
