
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Pesanan AdheGas</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  font-family:Arial;
  background:#eef2f7;
  padding:15px;
}
.container {
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}
h2 {color:#1769aa}
input, select {
  width:100%;
  padding:14px;
  margin:8px 0 18px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button {
  width:100%;
  padding:15px;
  background:#1769aa;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
  margin-top:8px;
}
#hasil {margin-top:15px}
#petaModal {
  display:none;
  position:fixed;
  inset:0;
  background:white;
  z-index:9999;
  padding:12px;
  box-sizing:border-box;
}
#map {
  height:65vh;
  width:100%;
  border-radius:10px;
  margin-top:10px;
}
.tutup {
  background:#666;
}
</style>
</head>

<body>

<div class="container">
<h2>Input Pesanan AdheGas</h2>

<form id="formPesan">

<label>Alamat Pengiriman</label>
<input id="alamat"
placeholder="Klik untuk menentukan lokasi"
readonly required
onclick="bukaPeta()">

<label>Barang</label>
<select id="barang" required>
<option value="">Memuat daftar barang...</option>
</select>

<label>Jumlah (jlh)</label>
<input id="jlh" type="number" min="1" required>

<label>Customer</label>
<input id="customer" required>

<button type="submit">Simpan Pesanan</button>

</form>

<p id="hasil"></p>
</div>

<!-- PETA -->
<div id="petaModal">

<h3>Tentukan Lokasi Pengiriman</h3>
<p id="statusGPS">Mencari posisi GPS...</p>

<div id="map"></div>

<button type="button" onclick="gunakanLokasi()">
Gunakan Lokasi Ini
</button>

<button type="button" class="tutup"
onclick="tutupPeta()">
Batal
</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
'https://bbjhnulqwhugdxucwjip.supabase.co',
'sb_publishable_VMUc-hCmm1YznMRzQE5wxg_YmUXz2Uh'
);

// MEMUAT BARANG DARI DATABASE

async function muatBarang() {

  const pilihan = document.getElementById('barang');

  const {data,error} = await supabase
    .from('stok_barang')
    .select('nama_barang')
    .order('nama_barang');

  pilihan.innerHTML = '<option value="">Pilih Barang</option>';

  if(error) {
    pilihan.innerHTML =
      '<option value="">Gagal memuat barang</option>';
    alert('Gagal membaca stok barang: '+error.message);
    return;
  }

  data.forEach(item => {
    const option = document.createElement('option');
    option.value = item.nama_barang;
    option.textContent = item.nama_barang;
    pilihan.appendChild(option);
  });
}

muatBarang();

// VARIABEL PETA

let map;
let marker;
let latitude = null;
let longitude = null;
let lokasiSiap = false;

// MEMBUKA PETA

window.bukaPeta = function() {

  document.getElementById('petaModal').style.display='block';

  if(!map) {

    map = L.map('map').setView([-6.2,106.8],15);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution:'© OpenStreetMap'
      }
    ).addTo(map);

    marker = L.marker([-6.2,106.8], {
      draggable:true
    }).addTo(map);

    marker.on('dragend',function() {
      ambilKoordinat();
    });

    map.on('click',function(e) {
      marker.setLatLng(e.latlng);
      ambilKoordinat();
    });

    setTimeout(()=>map.invalidateSize(),300);
  }

  document.getElementById('statusGPS').textContent =
    'Sedang mencari posisi GPS...';

  if(navigator.geolocation) {

    navigator.geolocation.getCurrentPosition(
      function(pos) {

        latitude = pos.coords.latitude;
        longitude = pos.coords.longitude;

        marker.setLatLng([latitude,longitude]);
        map.setView([latitude,longitude],17);

        lokasiSiap = true;
        ambilKoordinat();

      },
      function(err) {
        document.getElementById('statusGPS').textContent =
          'GPS tidak tersedia atau izin lokasi ditolak. Silakan cari lokasi pada peta.';
      },
      {
        enableHighAccuracy:true,
        timeout:15000
      }
    );

  } else {
    document.getElementById('statusGPS').textContent =
      'HP tidak mendukung GPS.';
  }

};

// MENGAMBIL KOORDINAT DARI PIN

function ambilKoordinat() {

  const pos = marker.getLatLng();

  latitude = pos.lat;
  longitude = pos.lng;
  lokasiSiap = true;

  document.getElementById('statusGPS').textContent =
    'Lokasi dipilih. Mengambil alamat...';

  cariAlamat(latitude,longitude);
}

// MENGUBAH KOORDINAT MENJADI ALAMAT

async function cariAlamat(lat,lon) {

  try {

    const url =
      'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='
      +lat+'&lon='+lon;

    const response = await fetch(url);
    const data = await response.json();

    if(data.display_name) {
      document.getElementById('alamat').value =
        data.display_name;
    }

    document.getElementById('statusGPS').textContent =
      'Lokasi berhasil dipilih.';

  } catch(error) {

    document.getElementById('statusGPS').textContent =
      'Koordinat berhasil dipilih, tetapi alamat tidak dapat dimuat.';

  }
}

// MENYIMPAN PILIHAN LOKASI

window.gunakanLokasi = function() {

  if(!lokasiSiap) {
    alert('Silakan pilih lokasi pada peta terlebih dahulu.');
    return;
  }

  tutupPeta();

};

// MENUTUP PETA

window.tutupPeta = function() {
  document.getElementById('petaModal').style.display='none';
};

// MENYIMPAN PESANAN

document.getElementById('formPesan')
.addEventListener('submit',async function(e) {

  e.preventDefault();

  if(!lokasiSiap || !document.getElementById('alamat').value) {
    alert('Silakan tentukan alamat melalui peta.');
    return;
  }

  const data = {

    alamat:document.getElementById('alamat').value,
    barang:document.getElementById('barang').value,
    jlh:Number(document.getElementById('jlh').value),
    customer:document.getElementById('customer').value,
    latitude:latitude,
    longitude:longitude

  };

  const hasil = document.getElementById('hasil');

  hasil.textContent='Sedang menyimpan...';

  try {

    const {error} = await supabase
      .from('Pesan')
      .insert(data);

    if(error) {
      hasil.textContent='GAGAL: '+error.message;
    } else {
      hasil.textContent='PESANAN BERHASIL DISIMPAN';
      document.getElementById('formPesan').reset();

      latitude=null;
      longitude=null;
      lokasiSiap=false;
    }

  } catch(err) {

    hasil.textContent='GAGAL: '+err.message;

  }

});

</script>
</body>
</html>
