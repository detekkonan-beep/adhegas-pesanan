
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Pesanan AdheGas</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#eef2f7;
  padding:15px;
  margin:0;
}

.container{
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}

h2{color:#1769aa}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
}

input,select{
  width:100%;
  padding:14px;
  margin:8px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  background:white;
}

#map{
  width:100%;
  height:300px;
  border-radius:10px;
  margin:10px 0;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:15px;
  background:#1769aa;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  margin-top:12px;
}

button:disabled{
  background:#888;
}

.info{
  font-size:13px;
  color:#555;
  margin:5px 0 10px;
}

#hasil{
  margin-top:15px;
  font-weight:bold;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h2>Input Pesanan AdheGas</h2>

<form id="formPesan">

<label>Alamat Pengiriman</label>
<input id="alamat" placeholder="Alamat lengkap pelanggan" required>

<label>Lokasi Pengiriman</label>
<div id="map"></div>

<p class="info" id="statusLokasi">
Mencari lokasi GPS...
</p>

<button type="button" id="btnGPS">
Gunakan Lokasi GPS Saya
</button>

<label>Jenis Barang</label>
<select id="barang" required>
<option value="">Memuat jenis barang...</option>
</select>

<label>Jumlah (jlh)</label>
<input id="jlh" type="number" min="1"
placeholder="Masukkan jumlah" required>

<label>Nama Customer</label>
<input id="customer" placeholder="Nama pelanggan" required>

<button type="submit" id="btnSimpan">
Simpan Pesanan
</button>

</form>

<p id="hasil"></p>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
'https://bbjhnulqwhugdxucwjip.supabase.co',
'sb_publishable_VMUc-hCmm1YznMRzQE5wxg_YmUXz2Uh'
);

const el = id => document.getElementById(id);

let latitude = null;
let longitude = null;
let lokasiSiap = false;
let marker = null;

// ===============================
// PETA
// ===============================

const map = L.map('map').setView([-2.5,118],5);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);

setTimeout(() => map.invalidateSize(),500);

function pasangMarker(lat,lng){

  latitude = lat;
  longitude = lng;
  lokasiSiap = true;

  if(marker){
    marker.setLatLng([lat,lng]);
  }else{
    marker = L.marker([lat,lng],{
      draggable:true
    }).addTo(map);

    marker.on('dragend',function(){
      const p = marker.getLatLng();
      pilihLokasi(p.lat,p.lng);
    });
  }

  map.setView([lat,lng],17);

  el('statusLokasi').textContent =
  'Lokasi berhasil dipilih.';

  reverseAlamat(lat,lng);
}

// ===============================
// PILIH LOKASI
// ===============================

async function pilihLokasi(lat,lng){

  pasangMarker(lat,lng);

}

// ===============================
// ALAMAT OTOMATIS
// ===============================

async function reverseAlamat(lat,lng){

  try{

    const url =
    `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;

    const response = await fetch(url);
    const result = await response.json();

    if(result.display_name){
      el('alamat').value = result.display_name;
    }

  }catch(error){

    console.log('Alamat otomatis tidak tersedia',error);

  }
}

// Klik peta untuk menentukan lokasi
map.on('click',function(e){

  pilihLokasi(e.latlng.lat,e.latlng.lng);

});

// ===============================
// GPS
// ===============================

function gunakanGPS(){

  if(!navigator.geolocation){
    el('statusLokasi').textContent =
    'GPS tidak didukung perangkat ini.';
    return;
  }

  el('statusLokasi').textContent =
  'Sedang mencari lokasi GPS...';

  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      pilihLokasi(lat,lng);

    },

    function(error){

      el('statusLokasi').textContent =
      'GPS tidak ditemukan. Silakan pilih lokasi dengan mengetuk peta.';

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }

  );

}

el('btnGPS').addEventListener('click',gunakanGPS);

// ===============================
// JENIS BARANG
// ===============================


async function muatBarang(){

  const pilihan = document.getElementById('barang');

  pilihan.innerHTML =
    '<option value="">Memuat jenis barang...</option>';

  const {data,error} = await supabase
    .from('stok_barang')
    .select('nama_barang')
    .order('nama_barang', {ascending:true});

  if(error){

    console.error('Gagal membaca stok_barang:',error);

    pilihan.innerHTML =
      '<option value="">Gagal memuat: ' +
      error.message + '</option>';

    return;
  }

  pilihan.innerHTML =
    '<option value="">Pilih Jenis Barang</option>';

  data.forEach(item => {

    if(item.nama_barang){

      const option = document.createElement('option');

      option.value = item.nama_barang;
      option.textContent = item.nama_barang;

      pilihan.appendChild(option);

    }

  });

  if(data.length === 0){

    pilihan.innerHTML =
      '<option value="">Belum ada jenis barang</option>';

  }

}


// ===============================
// SIMPAN PESANAN
// ===============================

el('formPesan').addEventListener('submit',async function(e){

  e.preventDefault();

  if(!lokasiSiap){
    el('hasil').textContent =
    'Silakan tentukan lokasi pada peta terlebih dahulu.';
    return;
  }

  const data = {

    alamat:el('alamat').value.trim(),

    barang:el('barang').value,

    jlh:Number(el('jlh').value),

    customer:el('customer').value.trim(),

    latitude:latitude,

    longitude:longitude

  };

  const hasil = el('hasil');
  const tombol = el('btnSimpan');

  tombol.disabled = true;
  tombol.textContent = 'Menyimpan...';

  hasil.textContent = 'Sedang menyimpan pesanan...';

  try{

    const {error} = await supabase
      .from('Pesan')
      .insert(data);

    if(error){
      throw error;
    }

    hasil.textContent =
    'PESANAN BERHASIL DISIMPAN!';

    el('formPesan').reset();

    latitude = null;
    longitude = null;
    lokasiSiap = false;

    if(marker){
      map.removeLayer(marker);
      marker = null;
    }

    el('statusLokasi').textContent =
    'Silakan pilih lokasi pengiriman kembali.';

  }catch(error){

    hasil.textContent =
    'GAGAL MENYIMPAN: ' + error.message;

  }finally{

    tombol.disabled = false;
    tombol.textContent = 'Simpan Pesanan';

  }

});

// Cari GPS ketika halaman dibuka
gunakanGPS();

</script>

</body>
</html>
